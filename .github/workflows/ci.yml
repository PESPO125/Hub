name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  backend-ci:
    name: Backend Checks (API)
    runs-on: ubuntu-latest

    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias del Backend
        run: |
          python -m pip install --upgrade pip
          pip install -e "apps/api[dev]"

      - name: Ejecutar Tests y Linter (Pytest & Ruff)
        run: |
          cd apps/api
          pytest
          ruff check .

  frontend-ci:
    name: Frontend Checks (Web)
    runs-on: ubuntu-latest

    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del Frontend
        run: |
          cd apps/web
          npm ci

      - name: Ejecutar comprobaciones del Frontend
        run: |
          cd apps/web
          npm run typecheck
          npm run lint
          npm test
          npm run build