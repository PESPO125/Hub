name: CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias de Python y Ruff/Pytest
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff
          # Si tienes un requirements.txt, descomenta la siguiente línea:
          # pip install -r requirements.txt

      - name: Ejecutar linter Ruff
        run: ruff check .

      - name: Ejecutar tests con Pytest
        run: pytest

      - name: Configurar Node.js (Frontend)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias y verificar frontend
        run: |
          # Cambia 'frontend' por la ruta de tu carpeta de frontend si es distinta
          cd frontend
          npm ci
          npm run build
          # npm test -- --watchAll=false # Descomenta si tienes tests de frontend