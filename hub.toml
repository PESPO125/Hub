# Configuración central de Hub.
# Las variables HUB_* pueden reemplazar los valores operativos; la versión se define aquí.

version = "0.4.1"

# API y almacenamiento
env = "development"
database_url = ""
plugins_dir = "plugins"
data_dir = "data"
allow_untrusted_plugins = false
cors_origins = "http://localhost:5173"
allowed_hosts = "127.0.0.1,localhost"
task_workers = 4
