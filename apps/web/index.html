<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230ea5e9'/%3E%3Crect x='8' y='8' width='6' height='6' rx='1.5' fill='white'/%3E%3Crect x='18' y='8' width='6' height='6' rx='1.5' fill='white'/%3E%3Crect x='8' y='18' width='6' height='6' rx='1.5' fill='white'/%3E%3Crect x='18' y='18' width='6' height='6' rx='1.5' fill='white'/%3E%3C/svg%3E" />
    <title>Hub</title>
    <script>
      // Evita el parpadeo de tema antes de que cargue React.
      try {
        var t = localStorage.getItem("hub-theme") || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
